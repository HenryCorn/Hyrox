name: api-ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: dotnet restore services/api/Hyrox.Api/Hyrox.Api.csproj
      - run: dotnet build services/api/Hyrox.Api/Hyrox.Api.csproj -c Release --no-restore
      - run: dotnet test services/api/Hyrox.Api/Hyrox.Api.csproj --no-build
