name: mobile-ci
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable         # or: flutter-version: '3.24.4'
          cache: true

      - run: flutter --version

      - name: Get packages
        working-directory: apps/mobile
        run: flutter pub get

      - name: Analyze
        working-directory: apps/mobile
        run: flutter analyze --no-fatal-infos

      - name: Test
        working-directory: apps/mobile
        run: flutter test --no-pub
