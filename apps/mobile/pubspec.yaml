name: hyrox_tracker
description: "Hyrox race & training tracker with wearable integration."
publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.0.3
  riverpod: ^3.0.3
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  wakelock_plus: ^1.4.0

  # Nothing design typography
  google_fonts: ^6.2.1

  # Workout history persistence
  sqflite: ^2.3.3

  # Progress charts
  fl_chart: ^0.70.2

  # Health & fitness data (HealthKit on iOS, Health Connect on Android)
  health: ^13.1.3

  # GPS for running pace
  geolocator: ^14.0.2

  # Runtime permissions
  permission_handler: ^12.0.1

  # Auth & sync
  sign_in_with_apple: ^6.1.4
  google_sign_in: ^6.2.2
  flutter_secure_storage: ^9.2.4
  dio: ^5.8.0+1

  # Monetisation
  google_mobile_ads: ^5.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.5.4
  freezed: ^3.1.0
  json_serializable: ^6.9.5

flutter:
  uses-material-design: true
