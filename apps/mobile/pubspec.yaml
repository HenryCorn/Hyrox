name: hyrox_tracker
description: "Hyrox race & training tracker with wearable integration."
publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.0.3
  riverpod: ^3.0.3
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  wakelock_plus: ^1.4.0

  # Nothing design typography
  google_fonts: ^6.2.1

  # Health & fitness data (HealthKit on iOS, Health Connect on Android)
  health: ^12.2.0

  # GPS for running pace
  geolocator: ^13.0.4

  # Runtime permissions
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.5.4
  freezed: ^3.1.0
  json_serializable: ^6.9.5

flutter:
  uses-material-design: true
